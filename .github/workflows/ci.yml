name: CI

on:
  push:
    branches: [main, master]
    # A release tag is what a user actually installs, so the commit behind it
    # has to be tested. This used to be branches-only: a tag cut from a branch
    # other than main pointed at a commit no run had ever seen, and nothing
    # said so. Only the test matrix runs for a tag -- cross-build, coverage and
    # lint already ran on main for the same commit, and re-uploading coverage
    # would just overwrite the same report.
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        # linux/arm64 is one of the six platforms with a prebuilt codec, and it
        # was the only one never run: macos-latest is already arm64, windows and
        # ubuntu are amd64. A cross-compiled vet cannot see the difference,
        # because the arm64 libraries are loaded at run time through purego --
        # a load or FFI signature problem only shows up on the real thing.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        go: ['1.26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Fetch multi-frame test data
        run: bash scripts/fetch-testdata.sh

      - name: Test
        run: go test -count=1 -p 4 ./...

  cross-build:
    name: cross-build (32-bit and codec-less platforms)
    # Runs on branches and pull requests, not on a tag: the same commit has
    # already been through this job as a push to main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Fetch multi-frame test data
        run: bash scripts/fetch-testdata.sh

      # godicom has to build everywhere Go does, not only on the six platforms
      # where golibjpeg and goopenjpeg ship a native library. Those two return
      # ErrUnsupportedPlatform at run time instead of failing to build, which is
      # only worth anything if godicom builds there too.
      #
      # go vet rather than go build, so the _test.go files are type-checked as
      # well: an int that should have been a uint32 is just as wrong in a test.
      #
      # 32-bit targets are the ones that earn their place here. A DICOM value
      # length is unsigned 32 bits, so 0xFFFFFFFF does not fit in an int on a
      # 32-bit platform, and forcing it in turns the undefined-length sentinel
      # into -1. mips and mipsle are left out deliberately: purego does not
      # build for them (undefined: addStruct), which is upstream, not ours.
      - name: Build and vet where no prebuilt codec exists
        run: |
          set -euo pipefail
          for target in \
            windows/386 \
            linux/386 linux/arm linux/riscv64 linux/ppc64le \
            js/wasm wasip1/wasm; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done
          echo "== linux/arm GOARM=5"
          GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 go vet ./...

      # Compiling is not enough. An int is one bit too narrow for a mask like
      # 0xFF00FFFF, and that only shows when the code runs: every repeater mask
      # parsed to zero, so every tag matched the first one and the entire data
      # dictionary answered US. A static 386 binary runs on an amd64 kernel, so
      # this is a real test run rather than another compile.
      - name: Test on linux/386
        run: GOARCH=386 CGO_ENABLED=0 go test -count=1 ./...

  coverage:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Fetch multi-frame test data
        run: bash scripts/fetch-testdata.sh

      - name: Test with coverage
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks=all github.com/godicom-dev/godicom/...

      - name: Check gofmt
        run: |
          unformatted=$(find . -name '*.go' ! -path './pydicom/*' ! -name '*_generated.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
